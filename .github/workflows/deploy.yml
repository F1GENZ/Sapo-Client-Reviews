name: Deploy Sapo Reviews API to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapo-reviews-api-deploy
  # A cancelled deploy can stop between the source rsync and the PM2 reload,
  # leaving the running build behind the sources; queue instead of cancelling.
  cancel-in-progress: false

jobs:
  verify-server:
    name: Server lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  verify-client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  e2e:
    name: E2E
    uses: ./.github/workflows/ci-e2e.yml
    with:
      skip-verify: true

  deploy:
    name: Deploy API via SSH
    runs-on: ubuntu-latest
    needs: [verify-server, verify-client, e2e]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 20

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Prepare deploy metadata
        run: |
          printf "%s\n" "${GITHUB_SHA}" > DEPLOY_COMMIT

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload checked-out source to VPS
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".git-nested/" \
            --exclude ".github/" \
            --exclude ".antigravity/" \
            --exclude ".claude/" \
            --exclude ".env" \
            --exclude "client/" \
            --exclude "plans/" \
            --exclude "recipes/" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "dist.next/" \
            --exclude "dist.prev/" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/"

      - name: Install, migrate, build, swap, and reload PM2
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"

            env_value() {
              local name="$1"
              local value="${!name:-}"
              if [ -z "$value" ] && [ -f .env ]; then
                value="$(grep -E "^${name}=" .env | tail -n 1 | cut -d '=' -f 2- | tr -d '\r "' || true)"
              fi
              printf '%s' "$value"
            }

            PORT_VALUE="$(env_value PORT)"
            PORT_VALUE="${PORT_VALUE:-3000}"
            READINESS_VALUE="$(env_value READINESS_TOKEN)"
            if [ -z "$READINESS_VALUE" ]; then
              echo "READINESS_TOKEN is not set in the environment or in .env; /readyz cannot be probed" >&2
              exit 1
            fi

            # /readyz answers 200 with a status body once the token matches; only
            # status "down" (Redis or database unreachable) fails the deploy. A
            # "degraded" status reflects failures recorded before this deploy.
            probe_ready() {
              PROBE_URL="http://127.0.0.1:${PORT_VALUE}/readyz" PROBE_TOKEN="$READINESS_VALUE" node -e '
                const http = require("http");
                const req = http.get(
                  process.env.PROBE_URL,
                  { headers: { authorization: "Bearer " + process.env.PROBE_TOKEN } },
                  (res) => {
                    let body = "";
                    res.setEncoding("utf8");
                    res.on("data", (chunk) => { body += chunk; });
                    res.on("end", () => {
                      if (res.statusCode !== 200) process.exit(1);
                      try {
                        const status = JSON.parse(body).status;
                        process.exit(status === "ok" || status === "degraded" ? 0 : 1);
                      } catch {
                        process.exit(1);
                      }
                    });
                  },
                );
                req.on("error", () => process.exit(1));
                req.setTimeout(5000, () => {
                  req.destroy();
                  process.exit(1);
                });
              ' >/dev/null 2>&1
            }

            trap 'rm -rf dist.next' EXIT

            echo "Deploying commit $(cat DEPLOY_COMMIT)"
            npm ci
            npx prisma generate

            # Snapshot the running build before anything else changes, so a
            # failed start can be reverted to code that actually worked.
            rm -rf dist.prev
            if [ -d dist ]; then
              cp -a dist dist.prev
            fi

            npm run db:migrate

            # Build beside the live dist: a failed build leaves dist untouched.
            rm -rf dist.next
            npm run build -- --outDir dist.next

            if [ -d dist ]; then
              mv dist dist.old
            fi
            mv dist.next dist
            rm -rf dist.old

            BUILD_SHA="$(cat DEPLOY_COMMIT)" pm2 startOrReload ecosystem.config.cjs --update-env

            api_ready=""
            for _ in $(seq 1 20); do
              if probe_ready; then
                api_ready="yes"
                break
              fi
              sleep 3
            done

            if [ -z "$api_ready" ]; then
              echo "Post-reload /readyz probe failed; reverting to dist.prev" >&2
              if [ -d dist.prev ]; then
                rm -rf dist
                mv dist.prev dist
                BUILD_SHA="reverted-from-$(cat DEPLOY_COMMIT)" pm2 startOrReload ecosystem.config.cjs --update-env
              else
                echo "No previous build was available to restore" >&2
              fi
              exit 1
            fi

            pm2 save
            rm -rf dist.prev
            echo "Deploy healthy: f1genz-sapo-api is online"
          EOF
